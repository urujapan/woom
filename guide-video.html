<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WooM 使い方</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;1,300&family=DM+Sans:wght@300;400&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Baloo 2','DM Sans',sans-serif;background:linear-gradient(160deg,#fff5f8 0%,#FBEAF0 100%);color:#5A4650;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.stage{position:relative;width:100vw;height:100vh;max-width:520px;max-height:100vh;margin:0 auto;overflow:hidden;}
.head{position:absolute;top:5.5%;left:0;right:0;display:flex;flex-direction:column;align-items:center;z-index:5;}
.logo{width:70px;height:70px;color:#D4537E;}
.logo svg{display:block;width:100%;height:100%;}
.wm{height:30px;margin-top:6px;}
.wm text{font-family:'Baloo 2',sans-serif;font-weight:500;font-size:100px;fill:#D4537E;}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22% 12% 16%;text-align:center;opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease;pointer-events:none;}
.slide.on{opacity:1;transform:translateY(0);pointer-events:auto;}
.ico{font-size:80px;line-height:1;margin-bottom:22px;filter:drop-shadow(0 6px 14px rgba(212,83,126,.18));}
.stitle{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:34px;color:#C03D6B;font-style:italic;margin-bottom:20px;}
.sbody{font-size:19px;line-height:1.9;color:#7A5E68;font-weight:400;max-width:420px;}
.sbody b{color:#C03D6B;font-weight:600;}
.sbody .warn{display:inline-block;margin-top:14px;font-size:15px;color:#B08A9A;}
/* intro */
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transition:opacity .8s ease;}
.intro.on{opacity:1;}
.intro .biglogo{width:150px;height:150px;color:#D4537E;animation:pop 1s ease;}
.intro .bigwm{height:60px;margin-top:14px;}
.intro .bigwm text{font-family:'Baloo 2',sans-serif;font-weight:500;font-size:100px;fill:#D4537E;}
.intro .tag{margin-top:18px;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:#C97AA0;}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.bar{position:absolute;bottom:5%;left:12%;right:12%;height:5px;border-radius:3px;background:#F4D2DF;overflow:hidden;z-index:5;}
.barfill{position:absolute;left:0;top:0;bottom:0;width:0;background:#D4537E;border-radius:3px;}
.dots{position:absolute;bottom:8%;left:0;right:0;display:flex;gap:7px;justify-content:center;z-index:5;}
.dot{width:8px;height:8px;border-radius:50%;background:#F4C0D1;transition:background .3s,transform .3s;}
.dot.on{background:#D4537E;transform:scale(1.3);}
.tapstart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,245,248,.9);z-index:20;cursor:pointer;flex-direction:column;gap:12px;}
.tapstart .b{background:#D4537E;color:#fff;border:none;border-radius:40px;padding:14px 34px;font-size:18px;font-family:'Baloo 2',sans-serif;font-weight:500;cursor:pointer;}
.tapstart .h{font-size:13px;color:#B08A9A;}
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="head" id="head" style="opacity:0;transition:opacity .6s;">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="40"/><g transform="translate(5,-5) rotate(12 50 50)"><path d="M41,30 C33,35 33,47 43,49 C35,52 33,60 39,67 C47,56 59,54 61,45 C63,36 54,27 41,30 Z"/><path d="M43,49 C51,47 56,39 53,32"/><path d="M39,66 C40,70 41,72 42,74"/><ellipse cx="39" cy="75" rx="5" ry="3.5" transform="rotate(-18 39 75)" fill="currentColor" stroke="none"/></g></svg>
    </div>
    <svg class="wm" viewBox="0 -2 272 58" aria-label="woom"><text x="80" y="52">oom</text><text x="192" y="52" transform="rotate(180 135.5 27.5)">m</text></svg>
  </div>

  <div class="intro on" id="intro">
    <div class="biglogo" aria-hidden="true">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="50" r="40"/><g transform="translate(5,-5) rotate(12 50 50)"><path d="M41,30 C33,35 33,47 43,49 C35,52 33,60 39,67 C47,56 59,54 61,45 C63,36 54,27 41,30 Z"/><path d="M43,49 C51,47 56,39 53,32"/><path d="M39,66 C40,70 41,72 42,74"/><ellipse cx="39" cy="75" rx="5" ry="3.5" transform="rotate(-18 39 75)" fill="currentColor" stroke="none"/></g></svg>
    </div>
    <svg class="bigwm" viewBox="0 -2 272 58" aria-label="woom"><text x="80" y="52">oom</text><text x="192" y="52" transform="rotate(180 135.5 27.5)">m</text></svg>
    <div class="tag">かんたん 使い方ガイド</div>
  </div>

  <div id="slides"></div>
  <div class="dots" id="dots"></div>
  <div class="bar"><div class="barfill" id="barfill"></div></div>

  <div class="tapstart" id="tapstart">
    <button class="b" onclick="startShow()">▶ ガイドを再生</button>
    <div class="h">画面収録しながら再生すると動画になります</div>
  </div>
</div>

<script>
var STEPS=[
  {ico:'🎵',title:'胎内音を選ぶ',body:'<b>アップロード</b>・<b>録音</b>・<b>サンプル</b>から、赤ちゃんが聴いていた音を選びます。<br>波形のピンク枠がループ区間です。'},
  {ico:'🤰',title:'お腹録音を試す',body:'「<b>🤰 お腹録音（増幅）</b>」をオンにして、スマホをお腹に直接あてて録音。<span class="warn">⚠️ 医療用ではありません</span>'},
  {ico:'🎼',title:'BGMを選ぶ',body:'胎内音に重ねる音楽を選びます。<br>▶ で試聴、<b>👌</b> はテンポの相性が良い印です。'},
  {ico:'🎚️',title:'音量・テンポを調整',body:'胎内音とBGMの<b>音量バランス</b>や<b>テンポ</b>を、耳で聴きながら調整します。'},
  {ico:'▶️',title:'プレビューで確認',body:'ミックスした音を再生して確認。<br>気に入るまで何度でも調整できます。'},
  {ico:'🎁',title:'贈り物を完成',body:'赤ちゃんの<b>名前</b>や<b>メッセージ</b>を入れて、音源を生成します。'},
  {ico:'📤',title:'リンクをシェア',body:'できたリンクを送るだけ。<br>相手が開くと<b>アニメーション</b>とともに音楽が流れます 💌'}
];
var STEP_MS=5200, INTRO_MS=2800;
var slidesEl=document.getElementById('slides'), dotsEl=document.getElementById('dots');
STEPS.forEach(function(s,i){
  var d=document.createElement('div'); d.className='slide';
  d.innerHTML='<div class="ico">'+s.ico+'</div><div class="stitle">'+s.title+'</div><div class="sbody">'+s.body+'</div>';
  slidesEl.appendChild(d);
  var dot=document.createElement('div'); dot.className='dot'; dotsEl.appendChild(dot);
});
var slideEls=slidesEl.querySelectorAll('.slide'), dotEls=dotsEl.querySelectorAll('.dot');
var cur=-1, timer=null;
function showIntro(){
  document.getElementById('intro').classList.add('on');
  document.getElementById('head').style.opacity='0';
  dotsEl.style.opacity='0'; document.querySelector('.bar').style.opacity='0';
  animBar(INTRO_MS);
  timer=setTimeout(function(){ document.getElementById('intro').classList.remove('on'); document.getElementById('head').style.opacity='1'; dotsEl.style.opacity='1'; document.querySelector('.bar').style.opacity='1'; next(); }, INTRO_MS);
}
function animBar(ms){
  var f=document.getElementById('barfill'); f.style.transition='none'; f.style.width='0';
  void f.offsetWidth; f.style.transition='width '+ms+'ms linear'; f.style.width='100%';
}
function next(){
  if(cur>=0) slideEls[cur].classList.remove('on');
  cur++;
  if(cur>=STEPS.length){ // loop back to intro
    dotEls.forEach(function(d){d.classList.remove('on');});
    showIntro(); return;
  }
  slideEls[cur].classList.add('on');
  dotEls.forEach(function(d,i){ d.classList.toggle('on', i===cur); });
  animBar(STEP_MS);
  timer=setTimeout(next, STEP_MS);
}
function startShow(){
  document.getElementById('tapstart').style.display='none';
  cur=-1; clearTimeout(timer);
  showIntro();
}
</script>
</body>
</html>
