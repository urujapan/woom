<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WooM Gift</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:Georgia,serif;background:#fbeef4;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;}
/* Gentle ambient background — same soft breathing visual as the preview. Plays
   regardless of which song was chosen; the finished audio carries the tempo, so
   this needs no sync, just a calm backdrop for the message. */
#bg{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;}
/* Loop video backdrop — shown only while the music is playing (body.vidon),
   above the ambient canvas but below the card. Muted so it never fights the
   music. Two stacked copies crossfade across the loop point (see JS) so the
   seam dissolves instead of jumping. The wrapper handles the overall show/hide
   fade; the inner .lv layers handle the seam crossfade. */
#loopvid{position:fixed;inset:0;z-index:1;opacity:0;pointer-events:none;}
#loopvid .lv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;}
.anim{position:fixed;inset:0;background:linear-gradient(135deg,#fff5f8,#f0f9f6);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:10;animation:hideAnim .6s ease 3.4s forwards;}
@keyframes hideAnim{to{opacity:0;visibility:hidden;pointer-events:none;}}
.scene{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.cradle{position:relative;width:90px;height:80px;transform-origin:50% 92%;animation:rock 1.6s ease-in-out infinite;}
.c-hood{position:absolute;top:0;left:15px;width:60px;height:34px;background:#FBEAF0;border:2.5px solid #E8A0B8;border-radius:50px 50px 0 0;border-bottom:none;}
.c-body{position:absolute;bottom:14px;left:5px;width:80px;height:42px;background:#fff5f8;border:2.5px solid #E8A0B8;border-radius:6px 6px 28px 28px;display:flex;align-items:center;justify-content:center;}
.c-zz{font-size:18px;margin-top:4px;}
.c-rock{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:72px;height:13px;background:#F4C0D1;border-radius:50%;}
.moon{font-size:26px;position:absolute;top:-14px;opacity:.85;}
@keyframes rock{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.fl{position:absolute;font-size:22px;opacity:0;animation:floatUp 2s ease-in forwards;}
@keyframes floatUp{0%{opacity:0;transform:translateY(0) scale(.7)}20%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:translateY(-90px) scale(1.1)}}
.env{font-size:44px;opacity:0;animation:flyAway 1.2s ease-in forwards;animation-delay:1.8s;}
@keyframes flyAway{0%{opacity:0;transform:translate(0,0) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(140px,-140px) scale(.4) rotate(20deg)}}
.ready{font-size:1.2rem;color:#D4537E;font-style:italic;opacity:0;animation:fadeUp .6s ease forwards;animation-delay:2.6s;text-align:center;margin-top:16px;padding:0 20px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Card floats over the ambient — translucent so the gentle glow shows through. */
.card{position:relative;z-index:5;max-width:360px;width:90%;background:rgba(255,255,255,.55);
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);
  border:1px solid rgba(255,255,255,.7);border-radius:20px;padding:2.5rem 2rem;text-align:center;
  box-shadow:0 12px 48px rgba(212,83,126,.28);opacity:0;animation:cardIn 2.2s ease 4s forwards;}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.heart{font-size:2.5rem;margin-bottom:.8rem;}
.gtitle{font-size:.8rem;color:#D4537E;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem;}
.message{font-size:1.3rem;color:#333;font-style:italic;line-height:1.6;margin:1rem 0;}
.divider{height:1px;background:#F4C0D1;margin:1rem 0;}
.from{font-size:13px;color:#888;margin-bottom:.4rem;}
.info{font-size:11px;color:#D4537E;margin-bottom:1.4rem;}
.play-btn{background:#D4537E;color:white;border:none;border-radius:50px;padding:14px 40px;font-size:16px;cursor:pointer;font-family:Georgia,serif;font-style:italic;}
.play-btn.on{background:#5DCAA5;}
.prog{width:100%;height:4px;background:rgba(240,240,240,.7);border-radius:2px;margin-top:10px;}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#D4537E,#5DCAA5);border-radius:2px;transition:width .3s linear;}
.brand{margin-top:1.6rem;font-size:10px;color:#bfa9b3;letter-spacing:.06em;}
/* ── Playing state ──────────────────────────────────────────────────────────
   Once playback starts the card steps aside so the Music Video is unobstructed;
   the message stays, small, over the footage. Tapping anywhere brings the card
   back (and tapping again dismisses it), so nothing is ever lost. */
.card{transition:opacity 1.1s ease, transform 1.1s ease;}
/* Once the entrance animation has finished, drop it — a running `forwards`
   animation outranks plain declarations, so without this the card could never be
   faded out again. .revealed then holds it visible until the playing state hides it. */
.card.revealed{animation:none;opacity:1;}
body.playing .card{opacity:0;transform:translateY(18px) scale(.97);pointer-events:none;}
.nowbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:22px 20px calc(20px + env(safe-area-inset-bottom));
  text-align:center;color:#fff;opacity:0;pointer-events:none;transition:opacity 1.1s ease;
  background:linear-gradient(to top,rgba(90,35,60,.55),rgba(90,35,60,0));
  text-shadow:0 1px 10px rgba(90,30,55,.55);}
body.playing .nowbar{opacity:1;pointer-events:auto;}
.nowbar .nb-baby{font-size:15px;letter-spacing:.05em;opacity:.95;}
.nowbar .nb-msg{font-size:13px;font-style:italic;margin-top:4px;opacity:.9;line-height:1.5;}
.nowbar .nb-from{font-size:11px;margin-top:6px;opacity:.8;}
.nowbar .nb-prog{max-width:320px;height:3px;margin:12px auto 0;background:rgba(255,255,255,.28);border-radius:2px;}
.nowbar .nb-bar{height:100%;width:0%;background:rgba(255,255,255,.9);border-radius:2px;transition:width .3s linear;}
.pausebtn{position:fixed;z-index:7;right:16px;top:16px;width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(255,255,255,.5);background:rgba(90,35,60,.35);color:#fff;font-size:16px;
  cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.1s ease;backdrop-filter:blur(6px);}
body.playing .pausebtn{opacity:1;pointer-events:auto;}
</style>
</head>
<body>
<canvas id="bg" width="900" height="600"></canvas>
<div id="loopvid">
  <video class="lv" id="lvA" src="gift_loop.mp4" loop muted playsinline autoplay preload="auto"></video>
  <video class="lv" id="lvB" src="gift_loop.mp4" loop muted playsinline autoplay preload="auto"></video>
</div>
<div class="anim">
  <div class="scene">
    <div class="fl" style="left:15px;top:60px;animation-delay:.3s">♪</div>
    <div class="fl" style="right:15px;top:70px;animation-delay:.6s">♡</div>
    <div class="fl" style="left:45px;top:40px;animation-delay:.9s">♫</div>
    <div class="fl" style="right:45px;top:50px;animation-delay:1.1s">♡</div>
    <div class="fl" style="left:30px;top:90px;animation-delay:1.4s">✨</div>
    <div class="fl" style="right:30px;top:85px;animation-delay:1.6s">♪</div>
    <div class="cradle">
      <div class="moon">🌙</div>
      <div class="c-hood"></div>
      <div class="c-body"><div class="c-zz">😴</div></div>
      <div class="c-rock"></div>
    </div>
    <div class="env">✉️</div>
  </div>
  <div class="ready" id="readyMsg">Your gift is ready! 🎁</div>
</div>
<div class="card">
  <div class="heart">♡</div>
  <div class="gtitle" id="gtitle">WooM</div>
  <div id="msgWrap"></div>
  <div id="fromWrap"></div>
  <div class="info">♡ Womb sound × Music blend</div>
  <audio id="au" preload="auto" crossorigin="anonymous"></audio>
  <button class="play-btn" id="pb" onclick="tog()">▶ Play</button>
  <div class="prog"><div class="bar" id="br"></div></div>
  <div class="brand">WooM</div>
</div>
<button class="pausebtn" id="pauseBtn" title="Pause">⏸</button>
<div class="nowbar" id="nowbar">
  <div class="nb-baby" id="nbBaby"></div>
  <div class="nb-msg" id="nbMsg"></div>
  <div class="nb-from" id="nbFrom"></div>
  <div class="nb-prog"><div class="nb-bar" id="nbBar"></div></div>
</div>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var baby=p.get('baby')||'';
  var msg=p.get('msg')||'';
  var from=p.get('from')||'';
  var audio=p.get('audio')||'';

  if(baby){
    document.getElementById('gtitle').textContent='WooM for '+baby;
    document.getElementById('readyMsg').textContent='Gift for '+baby+' is ready! 🎁';
    document.title='WooM for '+baby;
    document.getElementById('nbBaby').textContent='for '+baby;
  }
  // Same words repeated small over the video, for the playing state.
  document.getElementById('nbMsg').textContent=msg;
  document.getElementById('nbFrom').textContent=from?('— '+from):'';
  if(msg){
    var m=document.createElement('div'); m.className='message'; m.textContent=msg;
    var d=document.createElement('div'); d.className='divider';
    var w=document.getElementById('msgWrap'); w.appendChild(m); w.appendChild(d);
  }
  if(from){
    var f=document.createElement('div'); f.className='from'; f.textContent='— '+from;
    document.getElementById('fromWrap').appendChild(f);
  }
  if(audio){
    document.getElementById('au').src=audio;
  }
})();

// ── Gentle ambient background (soft breathing glow), drawn live on canvas so it
//    works on every device including iOS Safari (no video codec needed). ───────
(function(){
  var cv=document.getElementById('bg'), g=cv.getContext('2d');
  var W=cv.width, H=cv.height;
  // Deeper than the base #fbeef4 so the drift actually reads as movement — the
  // near-white palette this started with was invisible against the background.
  var pal=[[247,169,197],[240,150,183],[252,196,214],[233,176,214],[255,183,171]];
  var blobs=[];
  for(var i=0;i<5;i++){
    blobs.push({x:Math.random()*W,y:Math.random()*H,r:170+Math.random()*140,
      hue:pal[i],sp:0.22+Math.random()*0.10,ph:Math.random()*6.28,
      dx:(Math.random()-.5)*30,dy:(Math.random()-.5)*30});
  }
  function frame(t){
    g.fillStyle='#fbeef4'; g.fillRect(0,0,W,H);
    var breathe=0.5+0.5*Math.sin(t*2*Math.PI/5);
    for(var i=0;i<blobs.length;i++){
      var b=blobs[i];
      var cx=b.x+Math.sin(t*b.sp+b.ph)*150+b.dx*t;
      var cy=b.y+Math.cos(t*b.sp*0.8+b.ph)*105+b.dy*t;
      cx=((cx%(W+300))+(W+300))%(W+300)-150;
      cy=((cy%(H+300))+(H+300))%(H+300)-150;
      var rr=b.r*(0.85+0.25*Math.sin(t*b.sp*1.3+b.ph))*(0.9+0.2*breathe);
      var rad=g.createRadialGradient(cx,cy,0,cx,cy,rr);
      rad.addColorStop(0,'rgba('+b.hue[0]+','+b.hue[1]+','+b.hue[2]+',0.68)');
      rad.addColorStop(1,'rgba('+b.hue[0]+','+b.hue[1]+','+b.hue[2]+',0)');
      g.fillStyle=rad; g.beginPath(); g.arc(cx,cy,rr,0,6.29); g.fill();
    }
    var pr=150+30*breathe;
    var cg=g.createRadialGradient(W/2,H/2,0,W/2,H/2,pr);
    cg.addColorStop(0,'rgba(255,255,255,'+(0.20+0.12*breathe)+')');
    cg.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=cg; g.beginPath(); g.arc(W/2,H/2,pr,0,6.29); g.fill();
  }
  var last=0, clock=0;
  function tick(ts){
    if(!last) last=ts;
    clock += (ts-last)/1000; last=ts;
    // Skip the (expensive) ambient repaint while the loop video is covering it —
    // it's occluded during playback, and drawing it wastes CPU/GPU that the phone
    // needs for decoding + audio (was causing crackle on some devices).
    if(!(typeof _wrapOp!=='undefined' && _wrapOp>0.9)) frame(clock);
    requestAnimationFrame(tick);
  }
  frame(0);                 // paint one frame immediately, before rAF starts
  requestAnimationFrame(tick);
})();

var au=document.getElementById('au');
var pb=document.getElementById('pb');
var br=document.getElementById('br');
var nbBar=document.getElementById('nbBar');
// ── Loop video with a seamless crossfade ───────────────────────────────────
// Two copies of the clip, both looping forever and phase-offset by half its
// length, so whenever one copy is near its loop seam the other is mid-clip and
// clean. A requestAnimationFrame loop shows whichever copy is farther from its
// own seam, dissolving between them — the loop point's jump is never visible.
// Nothing is re-seeked or re-played mid-run, so playback doesn't stall.
var vids=[document.getElementById('lvA'),document.getElementById('lvB')];
var wrap=document.getElementById('loopvid');
var _rafOn=false, _warm=false, _lastTs=0;
var _wrapOp=0, _wrapTarget=0;   // wrapper opacity, hand-animated in rAF (not CSS)
var XWIN=1.4;      // crossfade half-width (s) — larger = gentler dissolve
var VSPEED=0.5;    // video playback speed — <1 slows the footage (muted, no pitch)
var FADE_SEC=2.0;  // seconds for the whole video layer to fade in / out
var FADEOUT_SEC=3.5; // over the last N seconds, fade the music + video out together
vids.forEach(function(v){ v.muted=true; }); // property, not just attribute — needed for muted autoplay
function _smooth(x){ x=x<0?0:(x>1?1:x); return x*x*(3-2*x); } // smoothstep 0→1

// Web Audio gain so the music can fade out on ALL platforms, including iOS where
// audio.volume is read-only. Cloudinary serves the WAV with CORS (access-control
// -allow-origin:*) and the <audio> has crossorigin="anonymous", so routing the
// cross-origin element through the graph is allowed. Falls back to .volume (or
// nothing) if Web Audio is unavailable, so playback is never broken.
var _actx=null,_gain=null,_audioRouted=false;
function _ensureAudioGraph(){
  if(_audioRouted){ if(_actx&&_actx.state==='suspended'){ try{_actx.resume();}catch(e){} } return; }
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    _actx=new AC();
    var src=_actx.createMediaElementSource(au);
    _gain=_actx.createGain(); _gain.gain.value=1;
    src.connect(_gain); _gain.connect(_actx.destination);
    _audioRouted=true;
    if(_actx.state==='suspended') _actx.resume();
  }catch(e){ _actx=null; _gain=null; } // leave audio on its default path
}
var _endFading=false;
// Restore full level (and cancel any scheduled fade) — used at the start of
// playback and after it ends, so a replay isn't silent.
function _resetMusicGain(){
  _endFading=false;
  if(_gain&&_actx){ try{ _gain.gain.cancelScheduledValues(_actx.currentTime); _gain.gain.setValueAtTime(1,_actx.currentTime); }catch(e){} }
  try{ au.volume=1; }catch(e){}
}
// Fade the music to silence over `secs`. Uses a Web Audio ramp scheduled on the
// audio thread, so the fade stays smooth no matter what the main thread / rAF is
// doing. Also starts the video fading out. Falls back to a stepped .volume ramp
// (driven from timeupdate) where Web Audio isn't available.
function _startEndFade(secs){
  if(_endFading) return; _endFading=true;
  _wrapTarget=0; secs=Math.max(0.1,secs);
  if(_gain&&_actx){
    try{ var t0=_actx.currentTime;
      _gain.gain.cancelScheduledValues(t0);
      _gain.gain.setValueAtTime(_gain.gain.value,t0);
      _gain.gain.linearRampToValueAtTime(0.0001,t0+secs);
    }catch(e){}
  }
}

// Warm the footage as soon as it's allowed (muted autoplay needs no gesture), so
// by the time Play is tapped the video is already decoded and moving. Revealing
// it is then a pure opacity fade — no decode "pop", no fade over a black frame.
function _warmVideo(){
  var A=vids[0], B=vids[1], D=A.duration||10;
  if(!_warm){ _warm=true; try{ A.currentTime=0; B.currentTime=D/2; }catch(e){} } // half-clip offset
  vids.forEach(function(v){ v.playbackRate=VSPEED; var p=v.play(); if(p&&p.catch)p.catch(function(){}); });
  if(!_rafOn){ _rafOn=true; requestAnimationFrame(_seamLoop); }
}
if(vids[0].readyState>=1) _warmVideo();
vids[0].addEventListener('loadedmetadata', _warmVideo);
window.addEventListener('load', _warmVideo);
// Stop decoding while the tab is backgrounded; re-warm when it returns.
document.addEventListener('visibilitychange',function(){
  if(document.hidden){ _rafOn=false; vids.forEach(function(v){ try{v.pause();}catch(e){} }); }
  else { _lastTs=0; _warmVideo(); }
});

function _seamLoop(ts){
  if(!_rafOn) return;
  if(!_lastTs) _lastTs=ts; var dt=(ts-_lastTs)/1000; _lastTs=ts;
  if(dt>0.1) dt=0.1;            // clamp after a stall so the fade can't jump
  // Hand-animate the wrapper opacity toward its target. Doing this in JS (inline
  // style) rather than a CSS transition avoids iOS snapping opacity on a element
  // that contains a playing <video>.
  if(_wrapOp<_wrapTarget) _wrapOp=Math.min(_wrapTarget,_wrapOp+dt/FADE_SEC);
  else if(_wrapOp>_wrapTarget) _wrapOp=Math.max(_wrapTarget,_wrapOp-dt/FADE_SEC);
  wrap.style.opacity=_wrapOp.toFixed(3);
  // Seam crossfade between the two phase-offset copies.
  var A=vids[0], B=vids[1], D=A.duration||10;
  var dA=Math.min(A.currentTime, D-A.currentTime);
  var dB=Math.min(B.currentTime, D-B.currentTime);
  var aA=_smooth(0.5 + (dA-dB)/(2*XWIN));
  A.style.opacity=aA.toFixed(3);
  B.style.opacity=(1-aA).toFixed(3);
  // Watchdog: resume a copy that a browser paused at a loop wrap (muted → no gesture).
  if(A.paused){ var pa=A.play(); if(pa&&pa.catch)pa.catch(function(){}); }
  if(B.paused){ var pb2=B.play(); if(pb2&&pb2.catch)pb2.catch(function(){}); }
  if(_dbg) _dbgUpdate(A,B);
  requestAnimationFrame(_seamLoop);
}
function startVid(){
  _warmVideo();       // ensure warm (fallback if autoplay was blocked pre-gesture)
  _wrapTarget=1;      // fade the (already-playing) video layer in
}
function stopVid(){
  _wrapTarget=0;      // fade it out; keep the copies warm for an instant resume
}

// Optional on-screen readout (open the gift URL with &debug=1) so behaviour can
// be checked on a real phone, where this can't be inspected remotely.
var _dbg=new URLSearchParams(location.search).get('debug')==='1', _dbgEl=null;
if(_dbg){
  _dbgEl=document.createElement('div');
  _dbgEl.style.cssText='position:fixed;top:6px;left:6px;z-index:99;font:11px/1.4 monospace;color:#fff;background:rgba(0,0,0,.6);padding:5px 7px;border-radius:6px;white-space:pre;pointer-events:none;';
  (document.body||document.documentElement).appendChild(_dbgEl);
}
function _dbgUpdate(A,B){ if(!_dbgEl) return;
  var remain=au.duration?(au.duration-au.currentTime):0;
  _dbgEl.textContent='wrap '+_wrapOp.toFixed(2)+' →'+_wrapTarget
    +'\nA t'+A.currentTime.toFixed(1)+' op'+A.style.opacity+' '+(A.paused?'PAUSE':'play')+' rs'+A.readyState
    +'\nB t'+B.currentTime.toFixed(1)+' op'+B.style.opacity+' '+(B.paused?'PAUSE':'play')+' rs'+B.readyState
    +'\nremain '+remain.toFixed(1)+' gain '+(_gain?_gain.gain.value.toFixed(2):'vol'+au.volume.toFixed(2))
    +'\nactx '+(_actx?_actx.state:'none')+' rVFC '+('requestVideoFrameCallback' in A);
}
au.addEventListener('timeupdate',function(){
  if(au.duration){
    var pct=(au.currentTime/au.duration*100)+'%';
    br.style.width=pct; nbBar.style.width=pct;
    // Soft ending: once inside the last FADEOUT_SEC, start fading music + video.
    var remain=au.duration-au.currentTime;
    if(au.duration>FADEOUT_SEC+1 && remain<=FADEOUT_SEC && !au.paused) _startEndFade(remain);
    // Fallback ramp where Web Audio isn't wired up (desktop/Android only; iOS
    // ignores .volume, but there it fades via the scheduled Web Audio ramp above).
    if(_endFading && !_gain){ try{ au.volume=Math.max(0,Math.min(1,remain/FADEOUT_SEC)); }catch(e){} }
  }
});
au.addEventListener('ended',function(){
  pb.textContent='▶ Play'; pb.classList.remove('on');
  br.style.width='0%'; nbBar.style.width='0%';
  setPlayingView(false);            // bring the message card back at the end
  stopVid();                        // fade the loop video out when the song ends
  _resetMusicGain();                // restore level for a possible replay
});

// Playing view: card out of the way so the video fills the screen.
function setPlayingView(on){
  document.body.classList.toggle('playing', !!on);
}
// Hand control of the card from its entrance animation over to CSS classes.
(function(){
  var card=document.querySelector('.card');
  card.addEventListener('animationend',function(){ card.classList.add('revealed'); });
  setTimeout(function(){ card.classList.add('revealed'); },6600); // fallback (after cardIn 4s delay + 2.2s)
})();
function tog(){
  if(au.paused){
    startVid();                     // start the video synchronously inside the tap
                                    // gesture — some browsers block video.play()
                                    // once we're in au.play()'s async .then()
    _ensureAudioGraph();            // set up / resume Web Audio in the gesture (iOS)
    _resetMusicGain();              // full level at the start of playback
    au.play().then(function(){
      pb.textContent='⏸ Pause'; pb.classList.add('on');
      setPlayingView(true);
    }).catch(function(e){
      pb.textContent='▶ ('+e.name+')';
    });
  } else {
    au.pause(); pb.textContent='▶ Play'; pb.classList.remove('on');
    setPlayingView(false);
    stopVid();                      // fade the video out on manual pause too
    _resetMusicGain();              // cancel any end-fade so a resume isn't silent
  }
}
document.getElementById('pauseBtn').addEventListener('click',function(e){
  e.stopPropagation(); tog();
});
// Tap the screen while playing to peek at the full card again; tap to hide.
document.addEventListener('click',function(e){
  if(au.paused) return;
  if(e.target.closest('.card')||e.target.closest('.pausebtn')) return;
  setPlayingView(!document.body.classList.contains('playing'));
});
</script>
</body>
</html>
